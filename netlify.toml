# Multi-page static site — no SPA redirect needed.
# Each directory has its own index.html and is served directly.

# ── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net unpkg.com www.googletagmanager.com www.google-analytics.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: openweathermap.org tile.openstreetmap.org *.tile.openstreetmap.org images.unsplash.com; connect-src 'self' api.open-meteo.com openweathermap.org; frame-src 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Redirects live ONLY in /_redirects (Cloudflare Pages ignores this file).
